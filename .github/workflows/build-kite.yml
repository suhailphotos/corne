name: Build QMK (Kite)

on:
  push:
    branches: [ main ]
    tags:
      - 'kite-*'        # <— release tags for Kite
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed for creating/updating releases

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    strategy:
      matrix:
        keyboard: [boardsource/unicorne]
        keymap:   [suhail]

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Copy our keymap into QMK tree
        run: |
          mkdir -p "qmk_firmware/keyboards/${{ matrix.keyboard }}/keymaps/${{ matrix.keymap }}"
          cp -R qmk/keyboards/. qmk_firmware/keyboards/
          ls -la "qmk_firmware/keyboards/${{ matrix.keyboard }}/keymaps/${{ matrix.keymap }}"

      - name: Compile
        working-directory: qmk_firmware
        run: qmk compile -kb ${{ matrix.keyboard }} -km ${{ matrix.keymap }}

      - name: Compute artifact name
        id: names
        shell: bash
        env:
          KB: ${{ matrix.keyboard }}
          KM: ${{ matrix.keymap }}
        run: |
          KB_DASH="${KB//\//-}"
          KB_UNDER="${KB//\//_}"
          echo "ARTIFACT_NAME=qmk-${KB_DASH}-${KM}" >> "$GITHUB_ENV"
          echo "PREFIX=qmk_firmware/.build/${KB_UNDER}_${KM}" >> "$GITHUB_ENV"

      - name: Find exact firmware file
        id: findfile
        shell: bash
        run: |
          set -euo pipefail
          prefix="${PREFIX}"
          if compgen -G "${prefix}.uf2" > /dev/null; then
            file="${prefix}.uf2"
          elif compgen -G "${prefix}.hex" > /dev/null; then
            file="${prefix}.hex"
          elif compgen -G "${prefix}.bin" > /dev/null; then
            file="${prefix}.bin"
          else
            echo "No firmware file produced with prefix ${prefix}" >&2
            ls -la qmk_firmware/.build || true
            exit 1
          fi
          echo "BUILT_FILE=$file"  >> "$GITHUB_ENV"
          echo "built_file=$file"  >> "$GITHUB_OUTPUT"
          echo "Found: $file"

      - name: Upload firmware artifact (CI only)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.findfile.outputs.built_file }}
          if-no-files-found: error

      - name: Create GitHub Release for tagged build
        # Only run when this was triggered by a kite-* tag push
        if: startsWith(github.ref, 'refs/tags/kite-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}   # e.g. kite-v1.0.0
          name: "Kite – ${{ github.ref_name }}"
          body: "QMK firmware for Boardsource Unicorne built from tag ${{ github.ref_name }}."
          draft: false
          prerelease: false
          files: |
            ${{ steps.findfile.outputs.built_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
